gate: BINDING_GATE
owner_skill: uow-contract-binder
proposal_only: true
policy:
  mode: CONDITIONAL_HIL
  on_pass: AUTO_ADVANCE
  max_retries: 2
  on_retries_exhausted: REQUEST_HIL
  on_uncertainty: REQUEST_HIL
  waiver_allowed: false
checks:
- id: api-operations-resolved
  evaluator: script
  required: true
- id: db-objects-resolved
  evaluator: script
  required: true
- id: api-db-consistent
  evaluator: script
  required: true
- id: contract-versions-pinned
  evaluator: script
  required: true
- id: no-invented-contracts
  evaluator: independent-review
  required: true
evidence:
  required: true
  path: .comsatel/uow-development-design/runs/evidence/BINDING_GATE/
  gate_report: .comsatel/uow-development-design/runs/evidence/BINDING_GATE/gate-report-T03.yaml
note: El especialista entrega gate_proposal con estos checks; solo el orquestador decide el gate.
