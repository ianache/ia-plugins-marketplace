gate: TESTCASE_PUBLICATION_GATE
owner_skill: qa-sdlc-orchestrator
proposal_only: false
policy:
  mode: MANDATORY_HIL
  on_pass: AUTO_ADVANCE_AFTER_HUMAN_APPROVAL
  max_retries: 0
  on_retries_exhausted: REQUEST_HIL
  on_uncertainty: REQUEST_HIL
  waiver_allowed: false
checks:
- id: only-approved-tc-published
  evaluator: script
  required: true
- id: no-tsn-published
  evaluator: script
  required: true
- id: issue-body-minimal
  evaluator: script
  required: true
- id: idempotent-no-duplicates
  evaluator: script
  required: true
- id: no-secrets
  evaluator: script
  required: true
evidence:
  required: true
  path: .comsatel/qa-design/runs/<run-id>/evidence/TESTCASE_PUBLICATION_GATE/
note: El orquestador evalúa este gate con gate_governance.decide().
