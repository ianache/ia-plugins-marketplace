gate: TEST_DESIGN_REVIEW_GATE
owner_skill: qa-test-design-reviewer
proposal_only: true
policy:
  mode: CONDITIONAL_HIL
  on_pass: AUTO_ADVANCE
  max_retries: 0
  on_retries_exhausted: REQUEST_HIL
  on_uncertainty: REQUEST_HIL
  waiver_allowed: false
checks:
- id: tc-detail-complete
  evaluator: script
  required: true
- id: no-critical-risk-uncovered
  evaluator: script
  required: true
- id: no-tsn-without-tc
  evaluator: script
  required: true
- id: no-approved-tc-without-oracle
  evaluator: script
  required: true
- id: no-tc-without-test-data-requirement
  evaluator: script
  required: true
- id: test-data-safe
  evaluator: script
  required: true
- id: critical-traceability-complete
  evaluator: script
  required: true
- id: no-scope-or-evidence-conflict
  evaluator: independent-review
  required: true
- id: reviewer-independent-of-author
  evaluator: script
  required: true
- id: surface-target-complete
  evaluator: script
  required: true
- id: tc-api-assigned
  evaluator: script
  required: true
- id: ssp-tc-selection
  evaluator: script
  required: true
- id: test-data-plan-reviewed
  evaluator: independent-review
  required: true
evidence:
  required: true
  path: .comsatel/qa-design/runs/<run-id>/evidence/TEST_DESIGN_REVIEW_GATE/
  gate_report: .comsatel/qa-design/runs/<run-id>/evidence/TEST_DESIGN_REVIEW_GATE/gate-report-T03.yaml
note: El especialista entrega gate_proposal con estos checks; solo el orquestador
  decide el gate.
